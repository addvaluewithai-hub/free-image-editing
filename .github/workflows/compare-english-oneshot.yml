name: Compare Qwen3-TTS vs VoxCPM2 English One-Shot

on:
  push:
    branches: [main]
    paths:
      - "english_expression_script.py"
      - "qwen3_oneshot_expression_benchmark.py"
      - "vox_oneshot_expression_benchmark.py"
      - "vox_oneshot_modal.py"
      - ".github/workflows/compare-english-oneshot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modal-production
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Modal CLI
        run: python -m pip install --upgrade "modal==1.5.2"

      - name: Verify deployment secrets are configured
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$MODAL_TOKEN_ID" || (echo "MODAL_TOKEN_ID is missing" && exit 1)
          test -n "$MODAL_TOKEN_SECRET" || (echo "MODAL_TOKEN_SECRET is missing" && exit 1)
          test -n "$HF_TOKEN" || (echo "HF_TOKEN is missing" && exit 1)

      - name: Sync Hugging Face token to Modal Secret
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: modal secret create --force huggingface HF_TOKEN="$HF_TOKEN"

      - name: Ensure Qwen3-TTS model is cached
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal run qwen3_tts_modal.py::download_model

      - name: Run Qwen3-TTS long one-shot cold and warm
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal run qwen3_oneshot_expression_benchmark.py::benchmark --output-dir qwen3-oneshot-output

      - name: Run VoxCPM2 long one-shot cold and warm
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal run vox_oneshot_expression_benchmark.py::benchmark --output-dir vox-oneshot-output

      - name: Upload comparison audio and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-vs-voxcpm2-english-oneshot
          path: |
            qwen3-oneshot-output/
            vox-oneshot-output/
            english_expression_script.py
          if-no-files-found: ignore
          retention-days: 3
