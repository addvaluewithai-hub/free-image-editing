name: Benchmark Qwen3-TTS 1.7B English Expressions

on:
  push:
    branches: [main]
    paths:
      - "qwen17_tts_modal.py"
      - "qwen17_expression_benchmark.py"
      - "english_expression_script.py"
      - ".github/workflows/qwen17-expressions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modal-production
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Modal CLI
        run: python -m pip install --upgrade "modal==1.5.2"

      - name: Verify deployment secrets are configured
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$MODAL_TOKEN_ID" || (echo "MODAL_TOKEN_ID is missing" && exit 1)
          test -n "$MODAL_TOKEN_SECRET" || (echo "MODAL_TOKEN_SECRET is missing" && exit 1)
          test -n "$HF_TOKEN" || (echo "HF_TOKEN is missing" && exit 1)

      - name: Sync Hugging Face token to Modal Secret
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: modal secret create --force huggingface HF_TOKEN="$HF_TOKEN"

      - name: Cache Qwen3-TTS 1.7B model weights
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal run qwen17_tts_modal.py::download_model

      - name: Deploy isolated Qwen3-TTS 1.7B service
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal deploy qwen17_tts_modal.py

      - name: Benchmark Ryan natural expressions warm story
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal run qwen17_expression_benchmark.py::benchmark --output-dir qwen17-expressions-output

      - name: Upload Qwen3-TTS 1.7B audio and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-tts-17b-english-expressions
          path: qwen17-expressions-output/
          if-no-files-found: ignore
          retention-days: 3
