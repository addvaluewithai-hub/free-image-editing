name: Benchmark HiDream O1 8B on L4

on:
  push:
    branches: [main]
    paths:
      - "hidream_o1_benchmark.py"
      - ".github/workflows/hidream-o1-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hidream-o1-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Modal CLI
        run: python -m pip install --upgrade "modal==1.5.2"

      - name: Verify secrets
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$MODAL_TOKEN_ID" || (echo "MODAL_TOKEN_ID is missing" && exit 1)
          test -n "$MODAL_TOKEN_SECRET" || (echo "MODAL_TOKEN_SECRET is missing" && exit 1)
          test -n "$HF_TOKEN" || (echo "HF_TOKEN is missing" && exit 1)

      - name: Sync Hugging Face token to Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: modal secret create --force huggingface HF_TOKEN="$HF_TOKEN"

      - name: Download HiDream O1 weights on CPU
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal run hidream_o1_benchmark.py::download_model

      - name: Generate 10 graded images on L4
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal run hidream_o1_benchmark.py::benchmark --output-dir hidream-output

      - name: Upload HiDream images and benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hidream-o1-8b-l4-graded-10
          path: hidream-output/
          if-no-files-found: ignore
          retention-days: 3
