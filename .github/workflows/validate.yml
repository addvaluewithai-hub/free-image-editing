name: Validate Python

on:
  push:
    branches: [main]
    paths:
      - "qwen3_tts_modal.py"
      - "client.py"
      - "AGENTS.md"
      - "README.md"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "qwen3_tts_modal.py"
      - "client.py"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: python -m py_compile qwen3_tts_modal.py client.py
